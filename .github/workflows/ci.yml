name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm -r --workspace-concurrency=1 test

      - name: Build
        run: pnpm build

      - name: E2E tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum -- pnpm --filter @cy-ssh/desktop exec playwright test

      - name: E2E tests
        if: runner.os != 'Linux'
        run: pnpm --filter @cy-ssh/desktop exec playwright test

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: apps/desktop/test-results
          retention-days: 7
