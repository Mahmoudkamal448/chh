name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Mosh and socat (Linux, for the Mosh and serial E2E tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mosh socat

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm -r --workspace-concurrency=1 test

      - name: Build
        run: pnpm build

      - name: E2E tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum -- pnpm --filter @cy-ssh/desktop exec playwright test

      - name: E2E tests
        if: runner.os != 'Linux'
        run: pnpm --filter @cy-ssh/desktop exec playwright test

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: apps/desktop/test-results
          retention-days: 7

  server:
    name: sync server (Postgres + Docker image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cyssh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @cy-ssh/server...
      - name: Server tests (memory + Postgres stores)
        run: pnpm --filter @cy-ssh/server test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/cyssh
      - name: Build Docker image
        run: docker build -f apps/server/Dockerfile -t cy-ssh-server:ci .
