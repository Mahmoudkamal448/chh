# Run the UFQ website:
#   docker compose up -d --build
# Then open http://localhost:8080  (change the port with WEB_PORT=80 docker compose up -d)

services:
  web:
    build: .
    image: ufq-website:latest
    container_name: ufq-website
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
